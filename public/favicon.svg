<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#000" stroke="rgba(243,245,247,0.30)" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="2.2" fill="#f3f5f7">
    <animate attributeName="r" values="2.2;4.2;2.2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="16" r="3.2" fill="none" stroke="#f3f5f7" stroke-opacity="0.18" stroke-width="1">
    <animate attributeName="r" values="3.2;6.5;3.2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.18;0;0.18" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
